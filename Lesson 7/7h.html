<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 7h</title>
        <script>
            function convertToKM(length){
                return `${length * 1.6} km`;
            }

            function convertToMiles(length){
                return `${length/1.6} miles`;
            }

            function convertMilesToFoot(length){
                return `${length * 5280} ft`;
            }

            function convertKmsToFoot(length){
                return `${length * 3281} ft`
            }

            function convertLength(length, from, to){
                if(to === 'miles'){
                    if (from === 'miles'){
                        return `${length} miles`;
                    }
                    return convertToMiles(length);
                }else if(to === 'km'){
                    if(from === "km"){
                        return `${length} kms`;
                    }
                    return convertToKM(length);
                }else if(to ==="ft"){
                    if (from === 'km'){
                        return convertKmsToFoot(length);
                    }
                    return convertMilesToFoot(length);
                }else{
                    return 'Invalid to convert value!';
                }
            }

            console.log(convertLength(50,'miles','km'));
            console.log(convertLength(32,'km','miles'));
            console.log(convertLength(5,'km','ft'));
        </script>
    </head>

</html>
